name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcp-registry:
    needs: publish
    # On manual dispatch, publish to the registry even if the npm job failed
    # (e.g. the version was already published manually).
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC for registry auth
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          # Runner is ubuntu x64; release assets are named linux_amd64
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Sync server.json version with package.json
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # npm propagation can lag behind; retry a few times
          for i in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "Retry $i failed, waiting 60s..."
            sleep 60
          done
          exit 1
